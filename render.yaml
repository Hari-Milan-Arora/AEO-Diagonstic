services:
  - type: web
    name: aeo-diagnostic-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: SIMULATION_MODE
        value: true
      - key: DEBUG
        value: false
